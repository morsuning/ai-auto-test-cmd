# API自动化测试命令行工具配置文件
# 包含用例配置、LLM配置、请求配置、约束配置和内置数据集

[testcase]
# 用例生成数量
num = 10

# 输出文件路径
output = "test_cases.csv"

# 正例报文类型（xml或json）
type = "json"
# 正例报文（支持多行字符串）
positive_example = '''
{
  "user": {
    "name": "张伟",
    "age": 28,
    "phone": "13800138000",
    "email": "zhangsan@example.com",
    "address": "北京市朝阳区建国门外大街1号",
    "id_card": "110101199001011234",
    "bank_card": "6222021234567890",
    "profile": { "status_text": "pending" },
    "domain": "qq.com"
  },
  "order": {
    "amount": 199.99,
    "create_date": "20240101",
    "create_datetime": "2024-01-01T10:30:00.000+08:00",
    "region": "CN-01"
  },
  "system": {
    "active": true,
    "features": ["A", "B"],
    "meta": { "version": "v1.0.0" }
  }
}
'''

# 如果需要使用XML格式，可以这样配置：
# type = "xml"
# positive_example = '''
# <?xml version="1.0" encoding="UTF-8"?>
# <request>
#   <user>
#     <name>张伟</name>
#     <age>28</age>
#     <phone>13800138000</phone>
#     <email>zhangsan@example.com</email>
#     <address>北京市朝阳区建国门外大街1号</address>
#     <id_card>110101199001011234</id_card>
#     <bank_card>6222021234567890</bank_card>
#     <profile>
#       <status_text>pending</status_text>
#     </profile>
#     <domain>qq.com</domain>
#   </user>
#   <order>
#     <amount>199.99</amount>
#     <create_date>20240101</create_date>
#     <create_datetime>2024-01-01T10:30:00.000+08:00</create_datetime>
#     <region>CN-01</region>
#   </order>
#   <system>
#     <active>true</active>
#     <features>
#       <item>A</item>
#       <item>B</item>
#     </features>
#     <meta>
#       <version>v1.0.0</version>
#     </meta>
#   </system>
# </request>
# '''

# 随机化因子，控制数据变化程度（0.0-1.0，默认0.5）
# 0.0: 不进行任何随机化，保持原值
# 0.1-0.3: 低度随机化，适用于需要保持数据相对稳定的场景
# 0.4-0.6: 中度随机化，平衡变化程度和数据合理性
# 0.7-1.0: 高度随机化，适用于边界测试和异常情况测试
variation_rate = 0.5

[llm]
# LLM API Base URL
url = "http://localhost/v1"

# LLM API Key
api_key = "app-uS9lBUxxxxxxxxlxhggy7"

# 自定义提示词（可选）
# user_prompt = "请生成边界情况的测试用例，包括空值、极值、特殊字符等场景"

[request]
# 目标URL
url = "https://httpbin.org/post"

# 请求方法
method = "post"

# URL查询参数（数组格式），可输入多组
# query = [
#     "version=v1",
#     "source=atc-tool",
#     "debug=true"
# ]

# CSV测试用例文件路径
file = "test_cases.csv"

# 结果保存路径
save_path = "results.csv"

# 忽略TLS证书验证错误（默认为false）
ignore_tls_errors = false

# 请求超时时间（秒）
timeout = 5

# 并发请求数
concurrent = 3

# Bearer Token认证
# auth_bearer = "your_bearer_token_here"

# Basic Auth认证（格式：username:password）
# auth_basic = "username:password"

# API Key认证
# auth_api_key = "your_api_key_here"

# 自定义HTTP头（数组格式）
# headers = [
#     "X-API-Version: v1",
#     "X-Client-ID: atc-tool",
#     "X-Request-Source: automated-test"
# ]

# 约束系统配置，下列均为示例配置，可根据自身需求调整
[constraints]
# 约束系统开关（true: 启用约束系统，false: 使用随机变化模式）
enable = true

# 保持原值不变（系统元信息）
[constraints.system.meta]
type = "keep_original"
description = "保留系统元信息对象及其子字段原值"

# 在父级keep_original基础上，明确子字段不变
[constraints.system.meta.version]
type = "keep_original"
description = "保留版本号原值"

# 用户信息（嵌套路径）
[constraints.user.name]
type = "chinese_name"
description = "用户姓名（嵌套路径）"

[constraints.user.age]
type = "integer"
min = 18
max = 60
description = "用户年龄（min/max 示例）"

[constraints.user.phone]
type = "phone"
description = "用户手机号（嵌套路径）"

[constraints.user.email]
type = "email"
description = "用户邮箱（嵌套路径）"

[constraints.user.address]
type = "chinese_address"
description = "用户地址（嵌套路径）"

[constraints.user.id_card]
type = "id_card"
description = "用户身份证号（嵌套路径）"

[constraints.user.bank_card]
type = "bank_card"
description = "用户银行卡号（嵌套路径）"

[constraints.user.domain]
type = "email_domain_custom"
description = "邮箱域（自定义类型：dataset）"

[constraints.user.profile.status_text]
type = "status_text"
description = "自定义类型：订单状态文本（嵌套路径）"

[constraints.order.amount]
type = "float"
min = 0.01
max = 999999.99
precision = 2
description = "订单金额（嵌套路径）"

[constraints.order.create_date]
type = "date"
format = "20060102"
min_date = "20200101"
max_date = "20301231"
description = "订单创建日期（嵌套路径）"

[constraints.order.create_datetime]
type = "datetime"
min_datetime = "2020-01-01T00:00:00.000+08:00"
max_datetime = "2030-12-31T23:59:59.999+08:00"
timezone = "+08:00"
description = "订单创建时间（嵌套路径）"

[constraints.order.region]
type = "region_union"
description = "区域编码（自定义类型：values+dataset+pattern）"

# ----------------------
# 通用内置约束示例
# ----------------------

# 日期字段约束
[constraints.date]
type = "date"
format = "20060102" # Go时间格式
min_date = "20200101"
max_date = "20301231"
description = "日期字段，格式为YYYYMMDD"

# 日期时间字段约束（RFC 3339 Extended格式）
[constraints.datetime]
type = "datetime"
min_datetime = "2020-01-01T00:00:00.000+00:00"
max_datetime = "2030-12-31T23:59:59.999+00:00"
timezone = "UTC"
description = "RFC 3339 Extended格式的日期时间"

# 姓名字段约束
[constraints.name]
type = "chinese_name"
description = "中文姓名"

# 整数字段约束
[constraints.count]
type = "integer"
min = 1
max = 10000
description = "数量"

# 手机号字段约束
[constraints.phone]
type = "phone"
description = "中国大陆手机号"

# 邮箱字段约束
[constraints.email]
type = "email"
description = "邮箱地址"

# 浮点数字段约束
[constraints.price]
type = "float"
min = 0.01
max = 999999.99
precision = 2
description = "价格，保留2位小数"

# 地址字段约束
[constraints.address]
type = "chinese_address"
description = "中文地址"

# 身份证号字段约束
[constraints.id_card]
type = "id_card"
description = "中国身份证号"

# 银行卡号字段约束
[constraints.bank_card]
type = "bank_card"
description = "银行卡号"

# ----------------------
# 自定义类型与数据集示例
# ----------------------

# 在约束系统下声明自定义类型（支持 values / dataset / pattern）
# values类型，即该自定义类型（status_text）取值从values中随机选择
[constraints.types.status_text]
values = ["pending", "paid", "shipped", "cancelled"]
description = "订单状态文本"

# dataset类型，即该自定义类型（region_code）取值从dataset中随机选择符合正则表达式（pattern）的数据
[constraints.types.region_code]
dataset = "region_codes"
pattern = "^[A-Z]{2}-\\d{2}$"
description = "区域编码"

# 引用内置数据集作为自定义类型的数据源
[constraints.types.email_domain_custom]
dataset = "email_domains"
description = "邮箱域名（来自内置数据集）"

# 组合用法：同时使用values与dataset，并用pattern过滤
[constraints.types.region_union]
values = ["CN-99"]
dataset = "region_codes"
pattern = "^[A-Z]{2}-\\d{2}$"
description = "区域编码（值集合与数据集组合）"

# 无效正则示例：解析阶段不报错，生成阶段忽略pattern
[constraints.types.invalid_pattern_type]
values = ["X1", "Y2", "Z3"]
pattern = "(["
description = "无效正则示例，演示回退逻辑"

# 未知数据集示例：生成阶段回退至values
[constraints.types.unknown_dataset_type]
dataset = "non_existing_dataset"
values = ["fallbackA", "fallbackB"]
pattern = "^[A-Za-z]+$"
description = "未知数据集示例，演示回退至values"

# 空类型定义示例：生成阶段回退原值
[constraints.types.empty_type_spec]
description = "空类型定义示例，生成阶段将回退原值"

# 自定义数据集（供自定义类型引用），所有自定义数据集都需要在[constraints.datasets]下定义
[constraints.datasets]
region_codes = ["CN-01", "CN-02", "US-01", "US-02", "JP-01", "DE-01"]

# 使用自定义类型的字段约束示例
[constraints.order_status_text]
type = "status_text"
description = "订单状态（文本）"

[constraints.region]
type = "region_code"
description = "区域编码（自定义类型）"

[constraints.domain]
type = "email_domain_custom"
description = "邮箱域名（自定义类型）"

